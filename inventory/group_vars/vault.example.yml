---
# Скопируйте в vault.yml и зашифруйте ansible-vault encrypt.
vault_mysql_exporter_user: exporter
vault_mysql_exporter_password: CHANGE_ME
vault_grafana_admin_user: admin
vault_grafana_admin_password: CHANGE_ME
# Необязательно: пароль sudo Agent. Если отсутствует, Ansible спросит отдельно.
vault_agent_become_password: CHANGE_ME
# Если существующий Orchestrator API использует HTTP Basic Auth.
vault_orchestrator_api_user: ""
vault_orchestrator_api_password: ""
vault_telegram_bot_token: ""
vault_telegram_chat_id: ""
# Полная ссылка vless://... с параметрами security/type/sni/pbk при наличии.
vault_telegram_vless_uri: ""
